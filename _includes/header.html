<header class="d-flex flex-column flex-md-row align-items-center pb-3 mb-3 border-bottom">
  <div>
    <a href="{{ site.github.url }}/" class="d-flex align-items-center text-decoration-none">
      <span class="fs-3 fw-bold pt-3 pt-md-0">{{ site.title }}</span>
    </a>
    <a href="{{ site.github.url }}/" class="d-flex align-items-center text-decoration-none">
      <span>{{ site.description }}</span>
    </a>
  </div>
  <nav class="d-inline-flex mt-2 mt-md-0 ms-md-auto align-items-center">
    {% for item in site.data.settings.menu %}
      <a class="me-3 py-2 text-decoration-none" href="{{ site.github.url }}{{ item.url }}">{{ item.name }}</a>
    {% endfor %}
    <button class="theme-toggle me-3" id="theme-toggle" aria-label="Toggle theme">
      <i class="hn hn-brightness-high-solid" id="theme-toggle-light-icon"></i>
      <i class="hn hn-moon-solid" id="theme-toggle-dark-icon"></i>
    </button>
  </nav>
</header>

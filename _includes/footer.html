<footer class="pt-3 pt-md-3 pb-2 pb-md-0 text-muted border-top">
  <div class="row">
    <div class="col-12 text-center social-media-icons">
      {% for item in site.data.settings.social %}
          <a href="{{ item.link }}" class="mx-2 mx-md-3 text-decoration-none">
            <i class="fab fa-{{ item.icon }} link-icon"></i>
            <span class="link-text">{{ item.name }}</span>
          </a>
      {% endfor %}
    </div>
  </div>
</footer>
